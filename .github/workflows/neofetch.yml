name: neofetch
on:
  schedule: [{ cron: "0 6 * * *" }]   # daily: refresh stats + avatar
  push:
    paths: [config.toml, "*.py", .github/workflows/neofetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python neofetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add neofetch.svg neofetch.txt
          git diff --cached --quiet || (git commit -m "chore: refresh neofetch card" && git push)
